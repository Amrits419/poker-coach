server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the Express service on the Docker network so the
    # client never needs to know the server's real host/port.
    location /api/ {
        proxy_pass http://server:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback — let React Router (if used) or client-side routing
    # handle unknown paths instead of nginx 404ing them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
